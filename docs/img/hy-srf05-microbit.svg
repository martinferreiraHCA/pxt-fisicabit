  <path d="M788.0,196 C788.0,316 290,355 290,505" fill="none" stroke="#212121" stroke-width="4" stroke-linecap="round"/>
  <rect x="40" y="48" width="400" height="146" rx="8" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="55" y="58" width="18" height="12" rx="2" fill="#d32f2f"/>
  <text x="82" y="69" font-size="14" fill="#222" font-family="Arial">VCC → 3V (rojo)</text>
  <rect x="55" y="84" width="18" height="12" rx="2" fill="#212121"/>
  <text x="82" y="95" font-size="14" fill="#222" font-family="Arial">GND → GND (negro)</text>
  <rect x="55" y="110" width="18" height="12" rx="2" fill="#f9a825"/>
  <text x="82" y="121" font-size="14" fill="#222" font-family="Arial">TRIG → P8 (amarillo)</text>
  <rect x="55" y="136" width="18" height="12" rx="2" fill="#2e7d32"/>
  <text x="82" y="147" font-size="14" fill="#222" font-family="Arial">ECHO → P12 (verde)</text>
  <rect x="55" y="162" width="18" height="12" rx="2" fill="#9e9e9e"/>
  <text x="82" y="173" font-size="14" fill="#222" font-family="Arial">OUT → sin conectar</text>
  <text x="40" y="590" font-size="13" fill="#333" font-family="Arial">Con OUT libre, el HY-SRF05 funciona igual que el HC-SR04 (modo 4 cables): elegí HY-SRF05 en el bloque.</text>
  <text x="40" y="610" font-size="13" fill="#333" font-family="Arial">Modo 1 cable: OUT → GND y un solo pin del sensor (TRIG) → P8; en el bloque elegí "HY-SRF05 un solo cable" y poné</text>
  <text x="40" y="630" font-size="13" fill="#333" font-family="Arial">el mismo pin en TRIG y ECHO.</text>
  <text x="40" y="650" font-size="13" fill="#333" font-family="Arial">Alimentado a 3 V el alcance baja a ≈1,5–2 m. Con 5 V, divisor 1 kΩ / 2 kΩ en ECHO (el micro:bit tolera 3,3 V).</text>
  <text x="40" y="670" font-size="13" fill="#333" font-family="Arial">Segundo sensor: TRIG P1 · ECHO P2. Tercero: TRIG P15 · ECHO P16.</text>
</svg>
